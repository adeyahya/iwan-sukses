# Jalankan: docker compose up -d --build
# Isi .env di folder ini (lihat .env.example dan DEPLOY.md): NEXT_PUBLIC_SITE_URL, SESSION_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: iwan-sukses
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Alamat publik untuk login Google, dibaca saat container jalan (default: NEXT_PUBLIC_SITE_URL)
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${NEXT_PUBLIC_SITE_URL:?isi NEXT_PUBLIC_SITE_URL di .env}}
      SESSION_SECRET: ${SESSION_SECRET:?isi SESSION_SECRET di .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?isi GOOGLE_CLIENT_ID di .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?isi GOOGLE_CLIENT_SECRET di .env}
    volumes:
      - data:/data
    stop_grace_period: 30s

volumes:
  data:

# Jalankan: docker compose up -d --build
# Isi .env di folder ini (lihat .env.example): ADMIN_PASSWORD, SESSION_SECRET, NEXT_PUBLIC_SITE_URL.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: iwan-sukses
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di .env}
      SESSION_SECRET: ${SESSION_SECRET:?isi SESSION_SECRET di .env}
    volumes:
      - data:/data
    stop_grace_period: 30s

volumes:
  data:
